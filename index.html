<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 15px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Meu Site</h2>
    </header>

    <main>
        <h1>Olá! 👋</h1>

        <p>
            Bem-vindo ao meu primeiro site!
        </p>

        <button onclick="alert('Olá! O site está funcionando!')">
            Clique aqui
        </button>
    </main>

</body>
</html>
